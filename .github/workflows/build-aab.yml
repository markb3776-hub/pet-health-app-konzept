name: Build AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Disable Timer
        working-directory: app
        run: sed -i 's/const EXPIRY_DAYS = 90/const EXPIRY_DAYS = 9999/' App.tsx

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --clean

      - name: Decode Keystore
        working-directory: app/android/app
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > upload-key.keystore

      - name: Configure Signing
        working-directory: app/android
        run: |
          printf '\nMYAPP_UPLOAD_STORE_FILE=upload-key.keystore\n' >> gradle.properties
          printf 'MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.UPLOAD_KEY_ALIAS }}\n' >> gradle.properties
          printf 'MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.UPLOAD_STORE_PASSWORD }}\n' >> gradle.properties
          printf 'MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.UPLOAD_KEY_PASSWORD }}\n' >> gradle.properties
          echo "--- gradle.properties tail ---"
          tail -5 gradle.properties

      - name: Inject Signing Config into build.gradle
        working-directory: app/android/app
        run: |
          python3 << 'EOF'
          import re

          with open('build.gradle', 'r') as f:
              content = f.read()

          signing_block = """    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          }"""

          pattern = r'    signingConfigs \{.*?\n    \}'
          match = re.search(pattern, content, flags=re.DOTALL)

          if match:
              content = content[:match.start()] + signing_block + content[match.end():]
              print(f"Replaced signingConfigs block at position {match.start()}-{match.end()}")
          else:
              print("ERROR: Could not find signingConfigs block!")
              exit(1)

          content = content.replace(
              '            signingConfig signingConfigs.debug\n            def enableShrinkResources',
              '            signingConfig signingConfigs.release\n            def enableShrinkResources'
          )

          with open('build.gradle', 'w') as f:
              f.write(content)

          print("Signing config injected successfully")
          EOF

      - name: Build AAB (Android App Bundle)
        working-directory: app/android
        run: ./gradlew bundleRelease

      - name: Get version
        id: version
        working-directory: app
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Find and Rename AAB
        run: |
          AAB_FILE=$(find app/android/app/build/outputs -name "*.aab" -type f | head -1)
          echo "Found AAB: $AAB_FILE"
          cp "$AAB_FILE" simplyPet_v${{ steps.version.outputs.version }}.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: simplyPet_v${{ steps.version.outputs.version }}_AAB
          path: simplyPet_v${{ steps.version.outputs.version }}.aab
          retention-days: 90
