name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --clean

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        working-directory: app
        run: echo "version=$(node -p \"require('./app.json').expo.version\")" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk \
             simplyPet_v${{ steps.version.outputs.version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simplyPet_v${{ steps.version.outputs.version }}
          path: simplyPet_v${{ steps.version.outputs.version }}.apk
          retention-days: 30
