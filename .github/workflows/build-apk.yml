name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - tester
          - dev
          - both
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  build-tester:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'tester' || github.event.inputs.build_type == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --clean

      - name: Build APK (Tester - mit 90-Tage-Timer)
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        working-directory: app
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Find and Rename APK
        run: |
          APK_FILE=$(find app/android/app/build/outputs -name "*.apk" -type f | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" simplyPet_v${{ steps.version.outputs.version }}.apk

      - name: Upload Tester APK
        uses: actions/upload-artifact@v4
        with:
          name: simplyPet_v${{ steps.version.outputs.version }}_TESTER
          path: simplyPet_v${{ steps.version.outputs.version }}.apk
          retention-days: 30

  build-dev:
    if: ${{ github.event.inputs.build_type == 'dev' || github.event.inputs.build_type == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Disable Timer for DEV build
        working-directory: app
        run: sed -i 's/const EXPIRY_DAYS = 90/const EXPIRY_DAYS = 9999/' App.tsx

      - name: Expo prebuild
        working-directory: app
        run: npx expo prebuild --clean

      - name: Build APK (DEV - ohne Timer)
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        working-directory: app
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Find and Rename APK
        run: |
          APK_FILE=$(find app/android/app/build/outputs -name "*.apk" -type f | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" simplyPet_v${{ steps.version.outputs.version }}_DEV.apk

      - name: Upload DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: simplyPet_v${{ steps.version.outputs.version }}_DEV
          path: simplyPet_v${{ steps.version.outputs.version }}_DEV.apk
          retention-days: 30
